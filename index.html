<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
  <title>Планер задач — синхронизация</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    /* minimal toast */
    .toast-wrap { position: fixed; right: 12px; bottom: 12px; z-index: 1200; display:flex; flex-direction:column; gap:8px; }
    .toast { background:#111827; color:#fff; padding:10px 14px; border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,0.2); opacity:0.95; font-size:13px; }
    .toast.success { background:#10b981; }
    .toast.error { background:#ef4444; }
    .toast.info { background:#3b82f6; }
    /* reuse existing styles from your app — minimal override for toasts only */
  </style>
</head>
<body>
  <!-- keep your original HTML layout (omitted here for brevity in file preview) -->

  <!-- Toast host -->
  <div id="toastHost" class="toast-wrap"></div>

  <script>
    // ----------------------------
    // Firebase config (your project)
    // ----------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyA8ITrOwyOajwbLL2JzLUtCcM3ajbXpExA",
      authDomain: "planner-2-56a40.firebaseapp.com",
      databaseURL: "https://planner-2-56a40-default-rtdb.firebaseio.com",
      projectId: "planner-2-56a40",
      storageBucket: "planner-2-56a40.firebasestorage.app",
      messagingSenderId: "1082050869232",
      appId: "1:1082050869232:web:1b1109bec1980a64960f35"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // small toast helper
    function showToast(text, type = 'info', ttl = 3000) {
      const host = document.getElementById('toastHost');
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.textContent = text;
      host.appendChild(el);
      setTimeout(() => { el.style.transition = 'opacity 0.3s'; el.style.opacity = '0'; setTimeout(()=>el.remove(),300); }, ttl);
    }

    // Utils for in-memory tasks array
    function findTaskIndex(tasks, id) { return tasks.findIndex(t => t.id === id); }

    class TaskManager {
      constructor() {
        this.tasks = []; // array, kept in-sync via child_* listeners
        this.currentView = 'dashboard';
        this.editingTaskId = null;
        this.viewingTaskId = null;
        this.currentUser = localStorage.getItem('plannerUser') || 'Ярик';

        // bind UI methods if needed
        this.init();
      }

      init() {
        // minimal UI wiring (assume original page has elements)
        // connection state
        const connectedRef = database.ref('.info/connected');
        connectedRef.on('value', snap => {
          const online = snap.val() === true;
          const ind = document.getElementById('syncIndicator');
          const status = document.getElementById('syncStatus');
          if (online) {
            if (ind) ind.className = 'sync-indicator online';
            if (status) { status.textContent = 'Синхр.'; status.style.display = ''; }
          } else {
            if (ind) ind.className = 'sync-indicator offline';
            if (status) { status.textContent = 'Отключено'; status.style.display = ''; }
          }
        });

        window.addEventListener('online', () => { document.getElementById('syncIndicator').className='sync-indicator online'; showToast('Интернет: онлайн', 'success', 1500); });
        window.addEventListener('offline', () => { document.getElementById('syncIndicator').className='sync-indicator offline'; showToast('Интернет: офлайн', 'error', 3500); });

        // child listeners
        this.setupFirebaseListeners();

        // wire forms/buttons that still exist in your page
        // ensure modal auto-close on save — handled on promise resolution

        // initial render view
        try { document.getElementById('shareLink').value = window.location.href; } catch(e){}
      }

      setupFirebaseListeners() {
        const tasksRef = database.ref('tasks');

        // child_added
        tasksRef.on('child_added', snap => {
          const item = snap.val();
          if (!item || !item.id) return;
          const idx = findTaskIndex(this.tasks, item.id);
          if (idx === -1) this.tasks.push(item);
          else this.tasks[idx] = item;
          this.renderTasks();
          this.updateStats();
        }, err => { console.error('child_added err', err); showToast('Ошибка чтения задач: '+err.message, 'error'); });

        // child_changed
        tasksRef.on('child_changed', snap => {
          const item = snap.val();
          const idx = findTaskIndex(this.tasks, item.id);
          if (idx === -1) this.tasks.push(item);
          else this.tasks[idx] = item;
          this.renderTasks();
          this.updateStats();
          // if detail open, refresh it
          if (this.viewingTaskId === item.id) this.openDetailModal(item.id);
        }, err => { console.error('child_changed err', err); });

        // child_removed
        tasksRef.on('child_removed', snap => {
          const item = snap.val();
          const idx = findTaskIndex(this.tasks, item.id);
          if (idx !== -1) this.tasks.splice(idx, 1);
          this.renderTasks();
          this.updateStats();
          if (this.viewingTaskId === item.id) this.closeDetailModal();
        }, err => { console.error('child_removed err', err); });

        // initial load handled by child_added events firing for existing items
      }

      addTaskToFirebase(taskData) {
        const tasksRef = database.ref('tasks');
        const newRef = tasksRef.push();
        const obj = { id: newRef.key, ...taskData, completed: false, createdAt: new Date().toISOString(), createdBy: taskData.createdBy || this.currentUser };
        return newRef.set(obj).then(()=>obj).catch(err=>{ throw err; });
      }

      updateTaskInFirebase(id, taskData) {
        return database.ref('tasks/' + id).update(taskData);
      }

      removeTaskInFirebase(id) {
        return database.ref('tasks/' + id).remove();
      }

      // form submit — uses push/update and shows toasts, closes modal only after success
      async handleFormSubmit(e) {
        e.preventDefault();
        const submitBtn = e.target.querySelector('button[type=submit]');
        if (submitBtn) submitBtn.disabled = true;

        const taskData = {
          title: document.getElementById('taskTitle').value || '(Без названия)',
          description: document.getElementById('taskDescription').value || '',
          dueDate: document.getElementById('taskDueDate').value || '',
          priority: document.getElementById('taskPriority').value || 'medium',
          createdBy: document.getElementById('taskCreatedBy').value || this.currentUser,
          assignee: document.getElementById('taskAssignee').value || this.currentUser
        };

        try {
          if (this.editingTaskId) {
            await this.updateTaskInFirebase(this.editingTaskId, taskData);
            showToast('Задача обновлена', 'success', 1500);
            // if detail open, refresh it
            if (this.viewingTaskId === this.editingTaskId) {
              setTimeout(()=>this.openDetailModal(this.editingTaskId), 200);
            }
          } else {
            const created = await this.addTaskToFirebase(taskData);
            showToast('Задача создана', 'success', 1500);
          }
          this.closeModal();
        } catch (err) {
          console.error('save err', err);
          showToast('Ошибка при сохранении: ' + (err.message || err), 'error', 4000);
        } finally {
          if (submitBtn) submitBtn.disabled = false;
        }
      }

      // wrapper functions used by UI
      openModal() { document.getElementById('taskForm').reset(); document.getElementById('taskCreatedBy').value = this.currentUser; document.getElementById('taskAssignee').value = this.currentUser; this.editingTaskId = null; document.getElementById('taskModal').classList.add('active'); }
      closeModal() { document.getElementById('taskModal').classList.remove('active'); }

      openEditModal(id) {
        const t = this.tasks.find(x=>x.id===id); if(!t) return; this.editingTaskId = id; document.getElementById('taskTitle').value = t.title||''; document.getElementById('taskDescription').value = t.description||''; document.getElementById('taskDueDate').value = t.dueDate||''; document.getElementById('taskPriority').value = t.priority||'medium'; document.getElementById('taskCreatedBy').value = t.createdBy||this.currentUser; document.getElementById('taskAssignee').value = t.assignee||this.currentUser; document.getElementById('taskModal').classList.add('active'); }

      openDetailModal(id) {
        const t = this.tasks.find(x=>x.id===id); if(!t) { this.closeDetailModal(); return; }
        this.viewingTaskId = id;
        document.getElementById('detailTaskTitle').textContent = t.title||'';
        document.getElementById('detailTitle').textContent = t.title||'';
        document.getElementById('detailDescription').textContent = t.description||'-';
        document.getElementById('detailCreatedBy').textContent = t.createdBy||'-';
        document.getElementById('detailAssignee').textContent = t.assignee||'-';
        document.getElementById('detailDueDate').textContent = t.dueDate? t.dueDate : '—';
        document.getElementById('detailCreatedAt').textContent = t.createdAt? new Date(t.createdAt).toLocaleString() : '-';
        const icons = { high:'🔴', medium:'🟡', low:'🟢' };
        document.getElementById('detailPriorityIcon').textContent = icons[t.priority]||'';
        const txtEl = document.getElementById('detailPriorityText'); txtEl.className = 'badge badge-priority-'+(t.priority||'medium'); txtEl.textContent = (t.priority||'medium').toUpperCase();
        // complete button text
        const completeText = document.getElementById('completeButtonText');
        if (t.completed) completeText.innerHTML = '<i class="fas fa-undo"></i> Восстановить'; else completeText.innerHTML = '<i class="fas fa-check"></i> Завершить';
        document.getElementById('taskDetailModal').classList.add('active');
      }
      closeDetailModal() { document.getElementById('taskDetailModal').classList.remove('active'); this.viewingTaskId = null; }

      async toggleTaskComplete(id) {
        const t = this.tasks.find(x=>x.id===id); if(!t) return;
        try { await database.ref('tasks/' + id).update({ completed: !t.completed, status: !t.completed ? 'done' : 'todo' }); showToast('Статус изменён','success',1200);} catch(e){ showToast('Ошибка: '+e.message,'error',3000);} }

      async deleteTask(id) { if (!confirm('Удалить задачу?')) return; try { await this.removeTaskInFirebase(id); showToast('Задача удалена','success',1200);} catch(e){ showToast('Ошибка удаления: '+e.message,'error',3000);} }

      // rendering functions — minimal, reuse existing markup presence
      getFilteredTasks(includeCompleted=false) {
        let arr = [...this.tasks]; if (!includeCompleted) arr = arr.filter(t=>!t.completed);
        // Apply filters from UI if exist
        const prEl = document.getElementById('filterPriority'); if (prEl) { const p = prEl.value; if (p !== 'all') arr = arr.filter(t=>t.priority===p); }
        const cb = document.getElementById('filterCreatedBy'); if (cb) { const v = cb.value; if (v==='me') arr = arr.filter(t=>t.createdBy===this.currentUser); else if (v!=='all') arr = arr.filter(t=>t.createdBy===v); }
        const as = document.getElementById('filterAssignee'); if (as) { const v = as.value; if (v==='me') arr = arr.filter(t=>t.assignee===this.currentUser); else if (v!=='all') arr = arr.filter(t=>t.assignee===v); }
        const search = (document.getElementById('searchTask')?.value||'').toLowerCase(); if (search) arr = arr.filter(t=> (t.title||'').toLowerCase().includes(search) || (t.description||'').toLowerCase().includes(search));
        // sort by dueDate then priority
        arr.sort((a,b)=>{ if(a.dueDate && b.dueDate) return a.dueDate.localeCompare(b.dueDate); if(a.dueDate) return -1; if(b.dueDate) return 1; return 0; });
        return arr;
      }

      renderTasks() {
        // dashboard
        const dashCont = document.getElementById('tasksList'); if (dashCont) {
          const arr = this.getFilteredTasks(false); if(arr.length===0) dashCont.innerHTML='<div class="empty-state">Нет задач</div>'; else dashCont.innerHTML = arr.map(t=>`
            <div class="task-card card rounded-lg p-3 priority-${t.priority}" onclick="taskManager.openDetailModal('${t.id}')">
              <div style=\"display:flex;gap:10px;\">\n                <div style=\"flex:1;min-width:0;\">\n                  <h4 style=\"font-weight:bold;margin:0 0 4px 0;\">${escapeHtml(t.title)}</h4>\n                  <div class=\"task-description-preview\">${escapeHtml(t.description||'')}</div>\n                </div>\n                <div style=\"display:flex;flex-direction:column;gap:6px;\">\n                  <button class=\"btn-icon btn-sm\" onclick=\"event.stopPropagation();taskManager.openEditModal('${t.id}')\"><i class=\"fas fa-edit\"></i></button>\n                  <button class=\"btn-icon btn-sm\" onclick=\"event.stopPropagation();taskManager.toggleTaskComplete('${t.id}')\"><i class=\"fas fa-check\" style=\"color:var(--success)\"></i></button>\n                </div>\n              </div>\n            </div>
          `).join(''); }

        // kanban
        const activeCol = document.getElementById('activeColumn'); const compCol = document.getElementById('completedColumn'); if (activeCol && compCol) { const all = this.getFilteredTasks(true); const active=all.filter(t=>!t.completed); const comp=all.filter(t=>t.completed); activeCol.innerHTML = active.map(t=>simpleCardHtml(t)).join('')||'<div class="empty-state">Пусто</div>'; compCol.innerHTML = comp.map(t=>simpleCardHtml(t)).join('')||'<div class="empty-state">Пусто</div>'; }

        // archive
        const arc = document.getElementById('archiveList'); if (arc) { const archived = this.getFilteredTasks(true).filter(t=>t.completed); arc.innerHTML = archived.length ? archived.map(t=>archiveCardHtml(t)).join('') : '<div class="empty-state">Архив пуст</div>'; }

        // calendar if visible
        if (this.currentView==='calendar') this.renderCalendar();
        // update stats
        this.updateStats();
      }

      renderCalendar() {
        const year = this.currentDate.getFullYear(); const month = this.currentDate.getMonth(); const monthYear = document.getElementById('monthYear'); if(monthYear) monthYear.textContent = new Date(year, month).toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
        const firstDay = new Date(year, month, 1).getDay(); const daysInMonth = new Date(year, month+1,0).getDate(); let html = ''; const dayNames=['Пн','Вт','Ср','Чт','Пт','Сб','Вс']; dayNames.forEach(d=>html+=`<div style="font-weight:bold;text-align:center;padding:6px;font-size:14px">${d}</div>`);
        let startOffset = firstDay===0?6:firstDay-1; for(let i=0;i<startOffset;i++) html+='<div></div>';
        const filteredActive = this.getFilteredTasks(false);
        for(let day=1;day<=daysInMonth;day++){ const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`; const tasksForDay = filteredActive.filter(t=>t.dueDate===dateStr); const icons={high:'🔴',medium:'🟡',low:'🟢'}; html+=`<div class="calendar-day"><div class="day-number">${day}</div>${tasksForDay.length>0?`<div style="display:flex;flex-direction:column;gap:2px;margin-top:4px;">${tasksForDay.slice(0,4).map(t=>`<div class="task-preview" title="${escapeHtml(t.description||'')}" onclick="event.stopPropagation();taskManager.openDetailModal('${t.id}')"><span class="priority-icon">${icons[t.priority]||''}</span> <span>${escapeHtml(t.title)}</span> <span class="assignee">${escapeHtml(t.assignee||'')}</span></div>`).join('')} ${tasksForDay.length>4?`<div style="font-size:11px;opacity:0.7;text-align:left;">+${tasksForDay.length-4}</div>`:''}</div>`:''}</div>`; }
        document.getElementById('calendarGrid').innerHTML = html;
      }

      updateStats() {
        const active = this.tasks.filter(t=>!t.completed); const high = active.filter(t=>t.priority==='high').length; const medium=active.filter(t=>t.priority==='medium').length; const low=active.filter(t=>t.priority==='low').length; const completed=this.tasks.filter(t=>t.completed).length; try{document.getElementById('countHigh').textContent=high;document.getElementById('countMedium').textContent=medium;document.getElementById('countLow').textContent=low;document.getElementById('completedCount').textContent=completed;document.getElementById('archiveCount').textContent=completed;}catch(e){}
      }
    }

    // small helpers used in render
    function escapeHtml(s){ if(!s) return ''; return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
    function simpleCardHtml(t){ return `<div class="task-card card rounded-lg p-2 priority-${t.priority}" onclick="taskManager.openDetailModal('${t.id}')"><h4 style="font-weight:600;margin:0;">${escapeHtml(t.title)}</h4><div style="font-size:11px;opacity:0.7;">${t.dueDate?escapeHtml(t.dueDate):''}</div></div>`; }
    function archiveCardHtml(t){ return `<div class="task-card card rounded-lg p-3 priority-${t.priority}" onclick="taskManager.openDetailModal('${t.id}')"><div style="display:flex;justify-content:space-between;align-items:center;"><div><h4 style="margin:0;text-decoration:line-through;opacity:0.7">${escapeHtml(t.title)}</h4><div style="font-size:11px;opacity:0.8">${escapeHtml(t.assignee||'')}</div></div><button class="btn-sm" onclick="event.stopPropagation();taskManager.toggleTaskComplete('${t.id}')"><i class="fas fa-undo"></i></button></div></div>`; }

    // attach instance to window for UI bindings
    const taskManager = new TaskManager();

    // expose form handler for inline attribute
    window.taskManager = taskManager;
    window.taskManager.handleFormSubmit = taskManager.handleFormSubmit.bind(taskManager);
    // bind modal submit if present
    const form = document.getElementById('taskForm'); if(form){ form.addEventListener('submit', taskManager.handleFormSubmit.bind(taskManager)); }
  </script>
</body>
</html>
